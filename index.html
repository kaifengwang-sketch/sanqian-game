<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="一个文科生揣着三千块进城打工五年的文字养成小游戏。">
<meta name="theme-color" content="#0a7482">
<title>三千块进城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 版式：顶上一张交通卡（余额就是存款），五年是一条地铁线；下面是这一站发生的事和行程记录 */
:root {
  --bg: #edf1ef;
  --card: #fbfcfb;
  --ink: #14202a;
  --muted: #586a72;
  --rule: #d0dad7;
  --line: #0a7482;
  --line-ink: #f4fbfb;
  --amber: #a46606;
  --danger: #b83c26;
  --good: #2b7547;
  --chip: #e1e9e6;
  --ticket: #e4eff4;
  --font-display: "ZCOOL QingKe HuangYou", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1317; --card: #141e24; --ink: #e2eae8; --muted: #8c9ea5; --rule: #25333b;
    --line: #36b0be; --line-ink: #04161a; --amber: #e6ad47; --danger: #f07a61; --good: #6dc48c;
    --chip: #1c2930; --ticket: #17262e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1317; --card: #141e24; --ink: #e2eae8; --muted: #8c9ea5; --rule: #25333b;
  --line: #36b0be; --line-ink: #04161a; --amber: #e6ad47; --danger: #f07a61; --good: #6dc48c;
  --chip: #1c2930; --ticket: #17262e; color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.7; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--amber); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: flex; flex-direction: column; gap: 16px;
  min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
}
#start { flex: 1 1 auto; }
#game { display: flex; flex-direction: column; gap: 16px; }
#game[hidden], #start[hidden] { display: none !important; }

/* 开始页 */
.start { display: flex; flex-direction: column; gap: 16px; padding-top: 12px; }
.eyebrow { margin: 0; font-size: 14px; letter-spacing: .16em; color: var(--line); }
.title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(48px, 15vw, 76px); line-height: 1; letter-spacing: .02em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); line-height: 1.9; }
.train {
  background: var(--ticket); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
  border: 1px solid var(--rule); position: relative;
}
.train .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.train .st { font-size: 24px; font-weight: 700; }
.train .no { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.train .small { font-size: 14px; color: var(--muted); }
.train .arrow { flex: 1; border-bottom: 2px dashed var(--rule); margin: 0 10px; transform: translateY(-6px); min-width: 24px; }
.name-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.name-row label { font-size: 15px; color: var(--muted); }
.name-row input {
  font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--rule); border-radius: 10px;
  padding: 9px 12px; width: 10em; min-width: 0;
}
.album { display: flex; flex-direction: column; gap: 8px; }
.album h3, .sec-title { margin: 0; font-size: 14px; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slot { border: 1px dashed var(--rule); border-radius: 8px; padding: 6px 12px; font-size: 14.5px; color: var(--muted); }
.slot.got { border-style: solid; border-color: var(--line); color: var(--ink); }
.credit { margin: 0; font-size: 13px; color: var(--muted); }

/* 插图 */
.art { display: block; width: 100%; height: 100%; }
.art-hero { position: relative; flex: 1 1 260px; min-height: 260px; border-radius: 14px; overflow: hidden; }
.art-hero .art { position: absolute; inset: 0; }
.art-strip { height: 132px; }
.art-end { height: 200px; border-radius: 12px; overflow: hidden; margin-bottom: 18px; }

/* 交通卡 */
.pass { background: var(--card); border-radius: 16px; overflow: hidden; border: 1px solid var(--rule); box-shadow: 0 10px 28px -20px rgba(0,0,0,.45); }
.pass-band { background: var(--line); color: var(--line-ink); display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 16px; }
.brand { font-family: var(--font-display); font-size: 22px; letter-spacing: .05em; }
.pass-band .date { font-size: 14px; }
.pass-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.bal { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bal .lbl { font-size: 13.5px; letter-spacing: .14em; color: var(--muted); }
.bal .num { font-size: 36px; font-weight: 700; color: var(--amber); line-height: 1.1; }
.bal .num.neg { color: var(--danger); }
.who { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 15px; color: var(--muted); }
.who b { color: var(--ink); }

.metro { padding: 4px 14px 0; }
.rail { position: relative; height: 6px; border-radius: 3px; background: var(--rule); }
.rail i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--line); }
.rail b { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px var(--card); }
.stops { list-style: none; margin: -11px 0 0; padding: 0; display: flex; justify-content: space-between; }
.stops li { width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.stops li::before { content: ""; width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: var(--card); border: 3px solid var(--rule); }
.stops li.on::before { border-color: var(--line); }

.meters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; }
.meter { display: grid; grid-template-columns: auto minmax(0, 1fr) 2.2em; align-items: center; gap: 8px; font-size: 14.5px; }
.meter .bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--line); }
.meter.low .bar i { background: var(--danger); }
.meter.low .v { color: var(--danger); }
.meter .v { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border-radius: 999px; padding: 3px 12px; font-size: 14.5px; }
.chip b { font-family: var(--font-mono); font-weight: 700; margin-left: 4px; font-variant-numeric: tabular-nums; }

/* 这一站 */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 18px 16px; }
.card h2 { margin: 0 0 12px; font-size: 21px; line-height: 1.35; display: flex; align-items: center; gap: 9px; text-wrap: balance; }
.card h2::before { content: ""; flex: none; width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; border: 3px solid var(--line); }
.kicker { margin: 0 0 4px; font-size: 13px; color: var(--muted); }
.txt p { margin: 0 0 10px; }
.txt p:last-child { margin-bottom: 0; }
.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.choice {
  background: transparent; border: 1.5px solid var(--rule); border-radius: 10px; padding: 13px 16px; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 3px; line-height: 1.55;
}
.choice:hover { border-color: var(--line); }
.choice small { font-size: 14px; color: var(--muted); }
.primary { background: var(--line); color: var(--line-ink); border: 0; border-radius: 10px; padding: 13px 26px; font-weight: 700; cursor: pointer; }
.primary:hover { filter: brightness(1.08); }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 16px; }
.delta { font-family: var(--font-mono); font-size: 13.5px; padding: 2px 8px; border-radius: 6px; background: var(--chip); font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good); }
.delta.down { color: var(--danger); }
.sub { margin: -4px 0 14px; font-size: 14px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.act {
  background: transparent; border: 1.5px solid var(--rule); border-radius: 10px; padding: 12px 14px; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 3px; min-width: 0;
}
.act:hover { border-color: var(--line); }
.act b { font-size: 17px; }
.act small { font-size: 13.5px; line-height: 1.45; color: var(--muted); }
.free { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.ghost { background: transparent; border: 1px dashed var(--rule); border-radius: 8px; padding: 7px 14px; font-size: 14.5px; color: var(--muted); cursor: pointer; }
.ghost:hover { border-color: var(--line); color: var(--ink); }
.ending .end-title { display: block; font-family: var(--font-display); font-weight: 400; font-size: 42px; line-height: 1.1; margin: 4px 0 14px; }
.ending .end-title::before { display: none; }
.sum { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 18px 0; font-size: 15px; }
.sum dt { color: var(--muted); }
.sum dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* 面试邀约和 offer */
.tickets { display: flex; flex-direction: column; gap: 8px; }
.ticket {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.ticket.offer { border-left-color: var(--amber); }
.ticket > div { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ticket small { font-size: 14px; color: var(--muted); }
.ticket .tag { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .06em; color: var(--line); }
.ticket.offer .tag { color: var(--amber); }
.ticket button { flex: none; }
.ticket .take { background: var(--amber); color: var(--card); border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 700; cursor: pointer; }
.ticket button:disabled { opacity: .45; cursor: not-allowed; }

/* 行程记录 */
.route { display: flex; flex-direction: column; gap: 8px; }
.stations { list-style: none; margin: 0; padding: 0 0 0 22px; position: relative; }
.stations::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--line); opacity: .55; }
.stations li { position: relative; padding: 3px 0 10px; display: flex; flex-direction: column; font-size: 15px; }
.stations li::before { content: ""; position: absolute; left: -21px; top: 8px; width: 11px; height: 11px; box-sizing: border-box; border-radius: 50%; background: var(--card); border: 2.5px solid var(--line); }
.stations .t { font-size: 12.5px; color: var(--muted); }

.foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--rule); padding-top: 14px; }
.toast { font-size: 14px; color: var(--good); }

@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="start" id="start" hidden>
    <p class="eyebrow">一个文科生的五年</p>
    <h1 class="title">三千块进城</h1>
    <p class="lede">七月，你拿到了汉语言文学的毕业证。没考研，也没考公。<br>兜里 3000 块：2000 是爸妈给的，1000 是做家教攒的。<br>高铁的终点站，是南屿。</p>
    <div class="train" aria-label="车票">
      <div class="row"><span class="st">老家</span><span class="arrow"></span><span class="no">G1024</span><span class="arrow"></span><span class="st">南屿</span></div>
      <div class="row small"><span>7月1日 08:15 开</span><span>二等座 05 车 12F</span></div>
      <div class="row small"><span>全部家当 ¥3,000</span><span>限乘当日当次车</span></div>
    </div>
    <div class="name-row">
      <label for="nm">给自己起个名字</label>
      <input id="nm" type="text" maxlength="8" value="小林" autocomplete="off">
      <button class="primary" id="go" type="button">出发</button>
    </div>
    <div class="album" id="album"></div>
    <div class="art-hero"><canvas class="art" id="artStart" role="img" aria-label="傍晚，一列高铁开进南屿，城里的灯一盏盏亮起来"></canvas></div>
    <p class="credit">事件引擎部分改编自开源项目 lifesim-kit（MIT 许可）。人物、公司、城市均为虚构。</p>
  </section>

  <section id="game" hidden>
    <header class="pass" id="pass"></header>
    <section id="stage" aria-live="polite"></section>
    <section class="tickets" id="tickets"></section>
    <section class="route" id="route"></section>
  </section>

  <footer class="foot" id="foot">
    <button class="ghost" type="button" data-save>存档</button>
    <button class="ghost" type="button" data-load>读档</button>
    <button class="ghost" type="button" data-restart>重新开始</button>
    <span class="toast" id="toast" role="status"></span>
  </footer>
</div>
<script>
/*CORE-START*/
const Core = (() => {
  'use strict';

  // ---- rnd / pickWeighted / check 改编自 lifesim-kit（https://github.com/Jasonin2099/lifesim-kit）----
  // MIT License
  // Copyright (c) 2026 Jasonin2099
  // Permission is hereby granted, free of charge, to any person obtaining a copy of this software and
  // associated documentation files (the "Software"), to deal in the Software without restriction,
  // including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense,
  // and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so,
  // subject to the following conditions:
  // The above copyright notice and this permission notice shall be included in all copies or substantial
  // portions of the Software.
  // THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT
  // LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO
  // EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER
  // IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR
  // THE USE OR OTHER DEALINGS IN THE SOFTWARE.
  // 随机数状态是一个 uint32，存在存档里，读档后接着同一条随机序列。
  function rnd(s) {
    let t = (s.rng = (s.rng + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function pickWeighted(s, list, weightOf = (x) => x.weight ?? 1) {
    const total = list.reduce((a, x) => a + Math.max(0, weightOf(x)), 0);
    if (total <= 0) return null;
    let r = rnd(s) * total;
    for (const x of list) if ((r -= Math.max(0, weightOf(x))) < 0) return x;
    return list[list.length - 1];
  }
  const inRange = (v, lo, hi) => typeof v === 'number' && (lo === undefined || v >= lo) && (hi === undefined || v <= hi);
  function check(s, c) {
    if (!c) return true;
    if (typeof c === 'function') return Boolean(c(s));
    if (Array.isArray(c)) return c.every((x) => check(s, x));
    if (c.all) return c.all.every((x) => check(s, x));
    if (c.any) return c.any.some((x) => check(s, x));
    if (c.not) return !check(s, c.not);
    if (c.stat) return inRange(s.stats[c.stat], c.min, c.max);
    if (c.flag) return c.eq === false ? !s.flags[c.flag] : Boolean(s.flags[c.flag]);
    if (c.seen) return s.seen.includes(c.seen);
    if (c.phase) return s.phase === c.phase;
    if (c.house) return [].concat(c.house).includes(s.house);
    if (c.track) return Boolean(s.job) && [].concat(c.track).includes(s.job.track);
    if (c.month) return inRange(s.month, c.month.min, c.month.max);
    if (c.level) return Boolean(s.job) && inRange(s.job.level, c.level.min, c.level.max);
    throw new Error('unknown condition: ' + JSON.stringify(c));
  }
  // ---- lifesim-kit 部分结束 ----

  const BOUNDED = new Set(['energy', 'mood', 'skill', 'talk', 'network', 'perf', 'boss']);
  const GROW = new Set(['skill', 'talk', 'network']);
  const STAT_NAMES = { cash: '存款', energy: '精力', mood: '心态', skill: '专业', talk: '表达', network: '人脉', perf: '表现', boss: '领导印象' };
  const KEYS = Object.keys(STAT_NAMES);

  const rint = (s, a, b) => a + Math.floor(rnd(s) * (b - a + 1));
  const chance = (s, p) => rnd(s) < p;
  const say = (s, arr) => arr[Math.floor(rnd(s) * arr.length)];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const r100 = (v) => Math.round(v / 100) * 100;
  function shuffle(s, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd(s) * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 所有数值变化都走 add，上下限在这里统一处理。mult 只放大专业、表达、人脉的增长。
  function add(s, eff, mult = 1) {
    for (const [k, raw] of Object.entries(eff)) {
      if (!(k in s.stats)) continue;
      let v = Array.isArray(raw) ? rint(s, raw[0], raw[1]) : raw;
      if (GROW.has(k) && v > 0) v *= mult;
      const nv = s.stats[k] + v;
      s.stats[k] = BOUNDED.has(k) ? clamp(Math.round(nv), 0, 100) : Math.round(nv);
    }
  }
  function earn(s, amt) {
    s.stats.cash += amt;
    s.earn[s.month] = (s.earn[s.month] || 0) + amt;
  }

  function money(n) {
    const a = Math.abs(Math.round(n));
    let t;
    if (a >= 1e6) t = (a / 1e4).toFixed(0) + '万';
    else if (a >= 1e5) t = (a / 1e4).toFixed(1).replace(/\.0$/, '') + '万';
    else t = a.toLocaleString('en-US');
    return (n < 0 ? '−¥' : '¥') + t;
  }
  const calMonth = (m) => ((6 + m) % 12) + 1;
  const yearOf = (m) => Math.floor(m / 12) + 1;
  function stamp(s) {
    return `第${yearOf(s.month)}年 · ${calMonth(s.month)}月` + (s.phase === 'search' ? ` 第${s.week + 1}周` : '');
  }
  function log(s, x) {
    s.log.unshift({ t: stamp(s), x });
    if (s.log.length > 80) s.log.length = 80;
  }
  const nextId = (s) => ++s.uid;
  // 转正后、第二年起，一回合是一个季度
  function monthsPerTurn(s) { return s.job && s.job.prob === 0 && s.month >= 12 ? 3 : 1; }
  const gainMult = (s) => (s.phase === 'work' && monthsPerTurn(s) === 3 ? 2 : 1);
  function last12(s) {
    let t = 0;
    for (let m = s.month - 11; m <= s.month; m++) t += s.earn[m] || 0;
    return t;
  }

  // ---- 岗位线 ----
  // pay：每一级的基准月薪；start：应届生的招聘区间；req：升到这一级要的专业能力
  // watch：摸鱼被抓的基础概率；layoff：每月被裁的基础概率；diff：面试门槛
  const TRACKS = {
    media: {
      name: '新媒体运营', companies: ['「一口茶」茶饮', '「野鹿」咖啡', '「小满」零食'],

  // ---- 投简历 → 面试邀约 ----
  const WEIGHTS = {
    wide: () => ({ media: 3, edu: 3, admin: 2, sales: 1.5, ad: 1, live: 1.5, scam: 1.5, bigtech: 0.1 }),
    narrow: (s) => ({ ad: 3, media: 2, sales: 2, admin: 2, bigtech: s.stats.skill < 30 ? 0.2 : 0.5 + (s.stats.skill - 30) / 12 }),
    fair: () => ({ media: 2, edu: 2, admin: 1.5, sales: 2, ad: 1, live: 1, scam: 0.5 }),
  };
  function makeInvite(s, track, at) {
    const T = TRACKS[track];
    const company = say(s, T.companies);
    let level = 0, lo = T.start[0], hi = T.start[1];
    const pv = s.prev;
    // 有工作经验以后，邀约按上一份工作定级定薪
    if (pv && !T.trap) {
      if (pv.track === track) {
        level = pv.level;
        lo = r100(Math.max(T.start[0], pv.pay * 0.95));
        hi = r100(pv.pay * 1.25);
      } else {
        level = clamp(pv.level - 1, 0, T.titles.length - 1);
        lo = r100(Math.max(T.start[0], T.pay[level] * 0.9));
        hi = r100(Math.max(T.start[1], T.pay[level] * 1.15));
      }
    }
    return { uid: nextId(s), track, company, level, lo, hi, at };
  }
  function addInvites(s, n, mode) {
    const w = WEIGHTS[mode](s);
    const list = Object.keys(w).map((k) => ({ k, weight: w[k] }));
    for (let i = 0; i < n; i++) s.invites.push(makeInvite(s, pickWeighted(s, list).k, s.turn + 1));
  }
  // 面试里的随机都在排进队列时定好，场景渲染时不再掷骰子
  function enqueueInterview(s, inv) {
    if (inv.track === 'scam' || inv.track === 'live') {
      s.queue.push({ id: inv.track, p: { inv } });
      return;
    }
    const T = TRACKS[inv.track];
    const nT = inv.track === 'bigtech' ? 2 : 1;
    const tq = shuffle(s, QS[inv.track].map((_, i) => i)).slice(0, nT).map((i) => ({ k: inv.track, i }));
    const qs = [...tq, { k: 'general', i: rint(s, 0, QS.general.length - 1) }];
    const ord = qs.map((q) => shuffle(s, QS[q.k][q.i].o.map((_, j) => j)));
    s.queue.push({ id: 'hr', p: { inv, good: chance(s, T.goodHR), v: rint(s, 0, 99), qs, ord, i: 0, sc: 0, react: '', gb: 0 } });
  }
  function pushOffer(s, o) { s.offers.push({ uid: nextId(s), ...o }); }

  // 谈薪结果：答题得分 + 专业和表达 + 状态 + 一点运气，减去岗位门槛
  function settle(s, p, kind, ask, mid) {
    const inv = p.inv, T = TRACKS[inv.track];
    let score = p.sc / (2 * p.qs.length) + (s.stats.skill - 30) / 180 + (s.stats.talk - 30) / 180 + p.gb + (rnd(s) - 0.5) * 0.16;
    if (s.stats.energy < 30) score -= 0.1;
    if (s.stats.mood < 25) score -= 0.05;
    const q = score - T.diff;
    let pay = 0;
    if (kind === 'hi') { if (q >= 0.18) pay = ask; else if (q >= 0.02 && chance(s, 0.5)) pay = mid; }
    else if (kind === 'mid') { if (q >= 0.08) pay = ask; else if (q >= -0.06) pay = inv.lo; }
    else if (q >= -0.16) pay = inv.lo;
    if (!pay) {
      if (q > -0.22 && chance(s, 0.2)) s.later.push({ at: s.turn + rint(s, 1, 2), id: 'callback', p: { inv } });
      log(s, `面试${inv.company}：回去等通知`);
      return '“今天就先到这儿，你回去等通知吧。”\n\n你知道，这句话的意思一般就是凉了。';
    }
    const pw = T.comm ? '底薪' : '月薪';
    pushOffer(s, { track: inv.track, company: inv.company, level: inv.level, pay, exp: s.turn + 1 });
    log(s, `拿到${inv.company}的 offer，${pw} ${money(pay)}`);
    let text;
    if (pay === ask && kind === 'hi') text = 'HR 愣了一下，低头算了算：“可以，就按你说的。”';
    else if (pay === ask) text = 'HR 点点头：“这个数没问题。”';
    else if (kind === 'hi') text = `HR 笑了：“这个数有点高。我们最多给到 ${money(pay)}，你考虑一下？”`;

    else text = 'HR 爽快地答应了。你有点后悔，是不是报低了。';
    return `${text}\n\n${inv.company}给了 offer：${T.titles[inv.level]}，${pw} ${money(pay)}。两周内有效，在下面的 offer 栏里决定接不接。`;
  }

        { label: '交给主管', go: (s) => { add(s, { boss: 4 }); return '主管拍拍你：“懂事。”'; } },

    { id: 'media_viral', when: [{ track: 'media' }], once: false, cooldown: 6,

      ] },
    { id: 'edu_target', when: [{ track: 'edu' }], once: false, cooldown: 6,

        { label: '能签多少签多少', go: (s) => { add(s, { perf: -3, mood: 2 }); return '你没熬夜，也没逼家长。校长在晨会上点了你的名。'; } },

    { id: 'annual_party', when: [{ phase: 'work' }, (s) => [12, 1, 2].includes(calMonth(s.month))], once: false, cooldown: 6,

    { id: 'defense', when: [{ track: 'bigtech' }, (s) => s.job.prob === 0], once: false, cooldown: 6,

        { label: '按时睡觉', go: (s) => { add(s, { energy: 5 }); return '你讲得有点磕巴，但脑子是清醒的。'; } },

    { id: 'hr_egg', when: [{ flag: 'rudeHR' }, { month: { min: 30 } }, { level: { min: 2 } }],

        { label: '多加几天班，表现一下', go: (s) => { add(s, { perf: 6, energy: -10 }); return '那几天，你是全组最后一个走的。'; } },

    { id: 'drinking', when: [{ track: ['sales', 'edu', 'media', 'ad'] }], once: false, cooldown: 8,

        { label: '硬着头皮喝', go: (s) => { add(s, { energy: -8, boss: 6, network: 3 }); return '回家的出租车上，你吐了一路。第二天，客户加了你的微信。'; } },
        { label: '以茶代酒', go: (s) => { add(s, { boss: -3, mood: 2 }); return '领导的笑僵了一秒。客户倒是说：“年轻人，喝茶好。”'; } },
      ] },
  ];

  // ---- 结局 ----
  const ENDINGS = {
    million: { title: '年入百万打工人', tag: '最好结局',
      text: (s) => `你成了班里第一个年入百万的人。去年的收入是 ${money(last12(s))}。\n\n散场以后，你一个人走回学校门口。五年前你从这里出发，兜里揣着三千块，面试时连期望薪资都不敢往高了报。\n\n三千块进城的人，走到了这一步。` },
    success: { title: '小有所成', tag: '好结局',
      text: (s) => `去年你的收入是 ${money(last12(s))}。同学会上，有人找你内推，有人问你南屿的房价。\n\n${s.stats.cash >= 300000 ? '你在南屿付了首付，阳台上养着几盆绿萝。' : '你换了一套采光好的房子，阳台上养着几盆绿萝。'}\n\n加班到深夜的时候，你偶尔会想起第一次面试，连期望薪资都不敢说出口。` },
    backbone: { title: '中层骨干', tag: '不错的结局',
      text: (s) => `你现在是${s.job ? `${s.job.company}的${TRACKS[s.job.track].titles[s.job.level]}` : '一个正在看机会的老员工'}，身边带着几个刚毕业的年轻人。\n\n同学会上有人问你，第一年是怎么熬过来的。你想了想：“先找个住的地方，再说别的。”\n\n去年你的收入是 ${money(last12(s))}，存款 ${money(s.stats.cash)}。不算多，每一分都是自己挣的。` },
    light: { title: '城市里的一盏灯', tag: '普通结局',
      text: (s) => `同学会上你话不多，说自己${s.job ? `在${s.job.company}做${TRACKS[s.job.track].titles[s.job.level]}` : '最近在找工作'}。\n\n散场后你坐末班地铁回去。窗外一栋栋楼亮着灯，你想起五年前刚下高铁的那个晚上。\n\n日子不算好，也不算坏。这座城市的灯里，有一盏是你自己点的。` },
    kaogong: { title: '回老家考公上岸', tag: '爸妈最满意的结局',
      text: (s) => `你退了南屿的房子，把没用完的地铁卡留给了${s.house === 'shared' ? '室友' : '一个刚来南屿的学弟'}。\n\n县里的单位朝九晚五，食堂一顿饭五块钱。爸妈逢人就说孩子考上了。\n\n偶尔刷到南屿的新闻，你会多看两眼。` },
    scammed: { title: '被骗光', tag: '坏结局',
      text: () => '那 2980 块，是你在南屿最后的底气。报警回执还夹在钱包里，民警说这类案子很多，钱不一定追得回来。\n\n你给妈打电话，第一句话是：“我想回家。”\n\n后来你在网上看到有人曝光同一家公司，你在下面留了言：别交钱。' },
    kenlao: { title: '回家啃老', tag: '最差结局',
      text: (s, cause) => (cause === 'mood'
        ? '第二天，你退了房，买了回家的票。妈什么也没问，给你炖了一锅汤。\n\n你在家里躺了很久。有时候会想，当初再撑一撑会怎样。但大多数时候，你什么也不想。'
        : '你拖着来时那只行李箱，坐上了回老家的高铁。妈在出站口等你，一路上没提工作的事。\n\n晚饭时，爸只说了一句：“先歇着吧。”你的房间还是走时的样子，书架上那本《现代汉语》落了一层灰。\n\n之后的日子，你每天睡到中午。偶尔刷到南屿的招聘信息，看一眼，又划走了。') },
  };
  const ENDING_ORDER = ['million', 'success', 'backbone', 'light', 'kaogong', 'scammed', 'kenlao'];

  function endGame(s, id, cause) {
    const E = ENDINGS[id];
    let text = E.text(s, cause);
    if (s.flags.egg && ['million', 'success', 'backbone', 'light'].includes(id)) {
      text += `\n\n饭桌上，你讲起${s.rudeHR.who}后来成了你${s.flags.egg === 'client' ? '客户' : '下属'}的事，全桌笑成一片。`;
    }
    s.ending = {
      id, title: E.title, tag: E.tag, text, inc: last12(s), cash: s.stats.cash, months: s.month,
      role: s.job ? `${TRACKS[s.job.track].titles[s.job.level]} · ${s.job.company}` : '待业',
    };
    s.phase = 'over';
    s.queue = [];
    s.result = null;
    log(s, `结局：${E.title}`);
  }

  // ---- 搬家、离职 ----
  function moveTo(s, k) {
    const H = HOUSES[k];
    s.stats.cash += s.deposit;
    s.deposit = H.dep;
    s.stats.cash -= H.move;
    s.house = k;
    s.rentAdj = 0;
    if (k === 'sofa') s.sofaWeeks = 0;
    log(s, `住进了${H.name}`);
    return H.say + (H.move ? `\n\n一次交了 ${money(H.move)}，还剩 ${money(s.stats.cash)}。` : '');
  }
  function loseJob(s, why) {
    const j = s.job;
    s.prev = TRACKS[j.track].trap ? s.prev : { track: j.track, level: j.level, pay: j.pay };
    s.job = null;
    s.phase = 'search';
    s.week = 0;
    s.offers = [];
    s.invites = [];
    s.stats.perf = 50;
    s.stats.boss = 50;
    log(s, why);
    if (s.house === 'dorm') s.queue.push({ id: 'house', p: { forced: true, msg: '离职了，宿舍得在这周搬出去。' } });
  }

  // ---- 场景：build 必须是纯函数（界面会反复调用），随机只在 go 里用 ----
  const SC = {
    check: () => ({ title: '', text: '', choices: [{ label: '继续', go: () => {} }] }),
    info: (s, p) => ({ title: p.title, text: p.text, choices: [{ label: p.btn || '继续', go: () => {} }] }),
    ev: (s, p) => {
      const e = EVENTS.find((x) => x.id === p.e);
      return {
        title: e.title,
        text: typeof e.text === 'function' ? e.text(s) : e.text,
        choices: e.choices.filter((c) => check(s, c.when)).map((c) => ({ label: c.label, go: c.go })),
      };
    },
    house: (s, p) => {
      const keys = Object.keys(HOUSES).filter((k) => {
        if (k === s.house) return false;
        if (k === 'sofa') return Boolean(p.first);
        if (k === 'dorm') return Boolean(s.job && TRACKS[s.job.track].dorm);
        if (k === 'flat') return Boolean(s.job && s.job.pay >= 9000);
        return true;
      });
      let text;
      if (p.first) text = `高铁到站，南屿下着小雨。你得先找个地方住。\n\n兜里一共 ${money(s.stats.cash)}，每周吃饭大概要 250。租房群里能找到的是这些：`;
      else text = `${p.msg || '你在租房群里翻了一晚上。'}\n\n现在住的是${HOUSES[s.house].name}，存款 ${money(s.stats.cash)}。搬走时押金会退回来。`;
      const choices = keys.map((k) => ({ label: HOUSES[k].name, sub: `${HOUSES[k].cost}。${HOUSES[k].note}`, go: (s) => moveTo(s, k) }));
      if (!p.first && !p.forced) choices.push({ label: '不搬了', go: () => {} });
      return { title: p.first ? '先找个落脚的地方' : '找房子', text, choices };
    },
    dorm: (s) => ({
      title: '公司宿舍', text: `公司有员工宿舍，四人间，每月 300。你现在住的是${HOUSES[s.house].name}。`,
      choices: [{ label: '搬进宿舍', go: (s) => moveTo(s, 'dorm') }, { label: '不搬', go: () => {} }],
    }),
    hr: (s, p) => {
      const T = TRACKS[p.inv.track];
      const title = `面试 · ${p.inv.company}`;
      const head = `岗位：${T.titles[p.inv.level]}，${money(p.inv.lo)}–${money(p.inv.hi)}${T.comm ? '（底薪）' : ''}\n\n`;
      if (p.good) {
        return { title, text: head + GOOD_HR[p.v % GOOD_HR.length],
          choices: [{ label: '开始面试', go: (s) => { add(s, { mood: 2 }); s.queue.unshift({ id: 'q', p: { ...p, gb: 0.04 } }); } }] };
      }
      const b = BAD_HR[p.v % BAD_HR.length];
      return { title, text: head + b.text, choices: [
        { label: '忍着，继续面', go: (s) => { add(s, { mood: -6 }); s.queue.unshift({ id: 'q', p }); } },
        { label: b.retort, go: (s) => { add(s, { mood: 6 }); s.flags.rudeHR = true; if (!s.rudeHR) s.rudeHR = { who: b.who }; log(s, `在${p.inv.company}怼了面试官`); return b.after; } },
        { label: '起身走人', go: (s) => { add(s, { mood: 2 }); log(s, `面试${p.inv.company}，中途走了`); return '你说了句“打扰了”，拿起包走了出去。电梯门关上的时候，你长出了一口气。'; } },
      ] };
    },
    q: (s, p) => {
      const ref = p.qs[p.i];
      const Q = QS[ref.k][ref.i];
      const rounds = p.qs.length === 3 ? ['一面', '二面', 'HR 面'] : ['专业问题', 'HR 面'];
      return {
        title: `${p.inv.company} · ${rounds[p.i]}`,
        text: (p.react ? p.react + '\n\n' : '') + Q.q,
        choices: p.ord[p.i].map((j) => ({ label: Q.o[j][0], score: Q.o[j][1], go: (s) => {
          const sc = Q.o[j][1];
          s.queue.unshift({ id: p.i + 1 < p.qs.length ? 'q' : 'pay', p: { ...p, i: p.i + 1, sc: p.sc + sc, react: say(s, REACT[sc]) } });
        } })),
      };
    },
    pay: (s, p) => {
      const inv = p.inv, T = TRACKS[inv.track];
      const mid = r100((inv.lo + inv.hi) / 2), hiAsk = r100(inv.hi * 1.15);
      const opts = [['往高了报', hiAsk, 'hi'], ['报中间', mid, 'mid'], ['报个保底的', inv.lo, 'lo']];
      return {
        title: `${inv.company} · 谈薪`,
        text: (p.react ? p.react + '\n\n' : '') + `最后，HR 问：“你的期望薪资是多少？”\n\n招聘启事上写的是 ${money(inv.lo)}–${money(inv.hi)}${T.comm ? '，另有提成' : ''}。`,
        choices: opts.map(([l, v, k]) => ({ label: `${l}：${money(v)}`, go: (s) => settle(s, p, k, v, mid) })),
      };
    },
    scam: (s, p) => ({
      title: `面试 · ${p.inv.company}`,
      text: `岗位：高薪文员，${money(p.inv.lo)}–${money(p.inv.hi)}\n\nHR 夸你“气质好，一看就踏实”，五分钟就说你被录用了。\n\n随后她推过来一张单子：“入职前要上岗培训，培训费 2980，第一个月工资里全额返还。今天交，明天就能排课。”`,
      choices: [
        { label: s.stats.cash >= 2980 ? '交钱，抓住机会' : '钱不够，她说可以帮你办培训贷', go: (s) => {
          s.stats.cash -= 2980;
          s.flags.scammed = true;
          log(s, `给${p.inv.company}交了 2980 培训费`);
          s.later.push({ at: s.turn + 1, id: 'info', eff: { mood: -25 }, p: { title: '人去楼空', text: '周一早上九点，你到了那栋写字楼。那一层的玻璃门上贴着“招租”，前台空空荡荡。\n\nHR 的电话已经关机，微信也把你删了。你在楼道里站了很久。' } });
          return '你把钱转了过去。她笑着说：“下周一九点，直接来公司报到。”';
        } },
        { label: '说回去考虑一下', go: (s) => { add(s, { mood: 3 }); log(s, '识破了一个培训费骗局'); return '回去的路上你搜了一下这家公司。投诉平台上几十条，套路一模一样：先录用，再收培训费，然后人间蒸发。'; } },
      ],
    }),

  // ---- 跳槽 offer ----
  function externalOffers(s, n, headhunter) {
    const j = s.job, st = s.stats, out = [];
    for (let i = 0; i < n; i++) {
      const opts = [{ k: j.track, weight: TRACKS[j.track].trap ? 0 : 3 }];
      for (const k of ['media', 'ad', 'sales']) if (k !== j.track) opts.push({ k, weight: 1 });
      if (j.track !== 'bigtech' && st.skill >= 45 && st.talk >= 30) opts.push({ k: 'bigtech', weight: 1 + (st.skill - 45) / 10 });
      const t = pickWeighted(s, opts).k, T = TRACKS[t];
      let level, pay;
      if (t === j.track) {
        const up = st.perf >= 72 && j.level < T.titles.length - 1 && st.skill >= T.req[j.level + 1];
        level = j.level + (up ? 1 : 0);
        pay = r100(j.pay * ((headhunter ? 1.35 : 1.18) + rnd(s) * 0.25));
        if (up) pay = Math.max(pay, T.pay[level]);
      } else {
        level = clamp(j.level - 1, 0, T.titles.length - 1);
        pay = r100(Math.max(T.pay[level] * (0.95 + rnd(s) * 0.2), j.pay * (headhunter ? 1.35 : 1.1)));
      }
      const pool = T.companies.filter((c) => c !== j.company);
      const o = { uid: nextId(s), track: t, company: pool.length ? say(s, pool) : T.companies[0], level, pay, exp: s.turn + 1 };
      s.offers.push(o);
      out.push(o);
    }
    return out;
  }

    const j = s.job, st = s.stats;

    for (let k = 0; k <= j.level; k++) if (chance(s, p)) c += rint(s, 1500, 6000) * (1 + 0.5 * j.level);

      const big = r100(rint(s, 40000, 180000) * (1 + 0.4 * j.level));
      c += big;
      add(s, { mood: 10, perf: 8 });
      log(s, `签下大单，提成 ${money(big)}`);
      s.queue.push({ id: 'info', p: { title: '签下大单', text: `跟了大半年的客户终于签了。销售群里炸了锅，老板发了个 888 的红包。\n\n这一单的提成：${money(big)}。` } });
    }
    return Math.round(c);
  }

  function review(s, yearEnd) {
    const j = s.job, T = TRACKS[j.track];
    const sc = s.stats.perf * 0.7 + s.stats.boss * 0.3 + (rnd(s) - 0.5) * 16;
    const g = sc >= 80 ? 'S' : sc >= 66 ? 'A' : sc >= 48 ? 'B' : 'C';
    const title = yearEnd ? '年终考核' : '年中考核';
    const lines = [`${yearEnd ? '年终' : '年中'}绩效：${g}。`];
    const old = j.pay;
    const raise = { S: 0.18, A: 0.1, B: 0.03, C: 0 }[g];
    if (raise) { j.pay = r100(j.pay * (1 + raise)); lines.push(`月薪从 ${money(old)} 涨到 ${money(j.pay)}。`); }
    let pp = { S: 0.7, A: 0.3, B: 0, C: 0 }[g];
    if (pp && s.flags.defense) pp += 0.2;
    delete s.flags.defense;
    pp *= T.promo ?? 1;
    if (pp > 0 && j.level < T.titles.length - 1) {
      const need = T.req[j.level + 1];
      if (s.stats.skill < need) lines.push(`本来有机会晋升，但专业能力还差一截（要 ${need}，你是 ${s.stats.skill}）。`);
      else if (chance(s, pp)) {
        j.level += 1;
        j.pay = Math.max(r100(j.pay * 1.25), T.pay[j.level]);
        lines.push(`晋升为${T.titles[j.level]}！月薪涨到 ${money(j.pay)}。`);
        log(s, `晋升为${T.titles[j.level]}`);
      }
    }
    if (yearEnd) {
      const bonus = r100(old * T.bonus[g] * Math.min(1, j.months / 12));
      if (bonus > 0) { earn(s, bonus); lines.push(`年终奖 ${money(bonus)}。`); } else lines.push('年终奖：没有。');
    }
    s.stats.perf = Math.round(50 + (s.stats.perf - 50) * 0.4);
    if (g === 'S' || g === 'A') j.warn = 0;
    if (g === 'C') {
      j.c += 1;
      if (j.c >= 2) {
        s.queue.push({ id: 'info', p: { title, text: lines.join('\n') + '\n\n连续两次 C。HR 找你谈话：“你可能不太适合这个岗位。”你被辞退了。' } });
        add(s, { mood: -12 });
        loseJob(s, `连续两次绩效 C，被${j.company}辞退`);
        return;
      }
      lines.push('你被放进了绩效改进计划。下次再拿 C，就得走人。');
    } else j.c = 0;
    s.queue.push({ id: 'info', p: { title, text: lines.join('\n') } });
    log(s, `${yearEnd ? '年终' : '年中'}绩效 ${g}`);
  }
  // monthly：上班期间按月算生活费和床位费；找工作期间这两项按周扣
  function monthTick(s, monthly) {
    s.month += 1;
    const ci = calMonth(s.month);
    const j = s.job;
    if (j) {
      const T = TRACKS[j.track];
      j.months += 1;
      const risk = T.layoff * (s.stats.perf < 45 ? 2.5 : s.stats.perf > 75 ? 0.4 : 1) * (j.prob > 0 ? 0.5 : 1);
      if (T.collapse && chance(s, T.collapse)) collapse(s);
      else if (chance(s, risk)) layoff(s);
      else {
        let pay = j.pay;
        if (T.unpaid && chance(s, T.unpaid)) { j.owed += pay; pay = 0; }
        let inc = pay;
        if (T.comm === 'sales') inc += salesComm(s);
        if (T.comm === 'edu') inc += eduComm(s);
        if (T.stock && T.stock[j.level]) inc += Math.round(T.stock[j.level] / 12);
        earn(s, inc);
        if (j.months === 1 && s.jobsHeld === 1 && pay) {
          s.queue.push({ id: 'info', p: { title: '第一份工资', text: `工资到账的短信来了：${money(inc)}。你截了个图，想了想，还是没发朋友圈。\n\n给爸妈各转了 200，备注：“不用省。”` } });
          add(s, { cash: -400, mood: 8 });
        }
      }
    }
    if (s.flags.side) { s.side = Math.round(s.side * 1.02); earn(s, Math.round(s.side / 1000 * 60)); }
    const H = HOUSES[s.house];
    s.stats.cash -= H.rent ? H.rent + s.rentAdj : 0;
    if (monthly) {
      s.stats.cash -= 1200 + Math.round((s.job ? s.job.pay : 0) * 0.1);
      if (s.house === 'hostel') s.stats.cash -= H.week * 4;
      if (s.house === 'sofa') s.sofaWeeks += 4;
    }
    if (s.job && s.job.prob === 0 && s.job.months >= 4 && (ci === 1 || ci === 7)) review(s, ci === 1);
    if (s.flags.kaogong && ci === 12 && s.exam >= 20) s.queue.push({ id: 'exam' });
  }

  function probation(s) {
    const j = s.job;
    if (!j || j.prob <= 0) return;
    j.prob -= 1;
    if (j.prob > 0) return;
    const perf = s.stats.perf;
    if (perf >= 55 || (perf >= 42 && chance(s, s.stats.boss / 100))) {
      const old = j.pay;
      j.pay = r100(j.pay * 1.05);
      s.queue.push({ id: 'info', p: { title: '转正', text: `试用期结束，你转正了。月薪从 ${money(old)} 调到 ${money(j.pay)}。\n\n之后每年 1 月和 7 月各考核一次。` } });
      log(s, '转正');
    } else {
      s.queue.push({ id: 'info', p: { title: '试用期没过', text: 'HR 把你叫进会议室：“这三个月你的表现，没达到我们的预期。”\n\n你收拾东西的时候，同事们都盯着屏幕。' } });
      add(s, { mood: -12 });
      loseJob(s, `${j.company}试用期没过`);
    }
  }

  // ---- 回合结束 ----
  function trigger(s, e) {
    if (typeof e === 'string') e = EVENTS.find((x) => x.id === e);
    if (!e || (e.once !== false && s.seen.includes(e.id))) return;
    if (!s.seen.includes(e.id)) s.seen.push(e.id);
    if (e.cooldown) s.cool[e.id] = s.turn + e.cooldown;
    if (e.enter) e.enter(s);
    s.queue.push({ id: 'ev', p: { e: e.id } });
  }
  function maybeEvent(s, p) {
    if (!chance(s, p)) return;
    const pool = EVENTS.filter((e) => check(s, e.when) && !(e.once !== false && s.seen.includes(e.id)) && !((s.cool[e.id] ?? -1) > s.turn));
    const e = pickWeighted(s, pool);
    if (e) trigger(s, e);
  }
  function laterDue(s) {
    const due = s.later.filter((x) => x.at <= s.turn);
    s.later = s.later.filter((x) => x.at > s.turn);
    for (const x of due) { if (x.eff) add(s, x.eff); s.queue.push({ id: x.id, p: x.p || {} }); }
  }
  function expireOffers(s) {
    for (const o of s.offers.filter((o) => o.exp <= s.turn)) log(s, `${o.company}的 offer 过期了`);
    s.offers = s.offers.filter((o) => o.exp > s.turn);
  }
  function endSearchTurn(s) {
    const H = HOUSES[s.house];
    s.stats.cash -= FOOD_WEEK + (H.week || 0);
    add(s, { energy: 5 + H.e, mood: H.m });
    if (s.house === 'sofa') s.sofaWeeks += 1;
    // 本周的面试，一周最多去两个
    const due = s.invites.filter((v) => v.at <= s.turn);
    const go = due.slice(0, 2);
    const missed = due.slice(2).filter((v) => v.at < s.turn);
    for (const v of go) enqueueInterview(s, v);
    for (const v of missed) log(s, `错过了${v.company}的面试`);
    const done = new Set([...go, ...missed].map((v) => v.uid));
    s.invites = s.invites.filter((v) => !done.has(v.uid));
    laterDue(s);
    expireOffers(s);
    s.week += 1;
    if (s.week >= 4) { s.week = 0; monthTick(s, false); }
    if (s.phase === 'search' && s.invites.length < 3 && chance(s, 0.25)) addInvites(s, 1, 'wide');
    maybeEvent(s, 0.35);
    s.turn += 1;
    s.queue.push({ id: 'check' });
  }
  function endWorkTurn(s, n) {
    for (let k = 0; k < n && s.phase === 'work'; k++) monthTick(s, true);
    const H = HOUSES[s.house];
    add(s, { energy: 8 + H.e - (s.job && TRACKS[s.job.track].trap ? 8 : 0), mood: 1 + H.m });
    if (s.job) { add(s, { perf: -2 }); probation(s); }
    laterDue(s);
    if (s.phase === 'work') expireOffers(s);
    maybeEvent(s, n === 3 ? 0.65 : 0.45);
    s.turn += 1;
    s.queue.push({ id: 'check' });
  }
  function runCheck(s) {
    if (s.phase === 'over') return;
    if (s.month >= 60) { s.queue.unshift({ id: 'reunion' }); return; }
    if (s.job ? s.stats.cash < -3000 : s.stats.cash < 0) { s.queue.unshift({ id: 'bailout' }); return; }
    if (s.stats.mood <= 0) { s.queue.unshift({ id: 'breakdown' }); return; }
    if (s.stats.energy <= 0) {
      const fee = rint(s, 800, 2000);
      add(s, { cash: -fee, mood: -8, perf: -10 });
      s.stats.energy = 45;
      log(s, '累病了');
      s.queue.unshift({ id: 'info', p: { title: '病倒了', text: `你连着几天头晕，最后在${s.job ? '工位上' : '出租屋里'}晕了过去。\n\n医生说是过度劳累，开了药让你好好休息。医药费 ${money(fee)}。` } });
    }
    if (s.house === 'sofa' && s.sofaWeeks >= 4) {
      s.queue.unshift({ id: 'house', p: { forced: true, msg: '同学委婉地说，他对象下周要搬过来住了。你得找新住处了。' } });
    }
  }
  function flush(s) {
    while (s.queue.length && s.queue[0].id === 'check') { s.queue.shift(); runCheck(s); }
  }

  // ---- 对外接口 ----
  function snap(s) { return { ...s.stats, job: Boolean(s.job) }; }
  function diff(b, s) {
    const out = [];
    for (const k of KEYS) {
      if ((k === 'perf' || k === 'boss') && (!b.job || !s.job)) continue;
      const d = s.stats[k] - b[k];
      if (d) out.push({ k, name: STAT_NAMES[k], d });
    }
    return out;
  }
  const idle = (s) => s.phase !== 'over' && !s.result && !s.queue.length;

  function newGame(name, seed) {
    const s = {
      v: 1, rng: (seed ?? Math.floor(Math.random() * 4294967296)) >>> 0, uid: 0,
      name: String(name || '小林').trim().slice(0, 8) || '小林',
      phase: 'search', month: 0, week: 0, turn: 0,
      stats: { cash: 3000, energy: 80, mood: 70, skill: 20, talk: 20, network: 5, perf: 50, boss: 50 },
      flags: {}, seen: [], cool: {}, later: [],
      house: null, deposit: 0, rentAdj: 0, sofaWeeks: 0,
      invites: [], offers: [], job: null, prev: null,
      earn: {}, bailouts: 0, calls: 0, exam: 0, side: 0, vacYear: 0, jobsHeld: 0, rudeHR: null, lastViral: 0,
      queue: [{ id: 'house', p: { first: true } }], result: null, log: [], ending: null,
    };
    log(s, '揣着 3000 块，到了南屿');
    return s;
  }
  function view(s) {
    if (s.phase === 'over') return { mode: 'ending' };
    if (s.result) return { mode: 'result', ...s.result };
    if (s.queue.length) {
      const sc = build(s, s.queue[0]);
      return { mode: 'scene', title: sc.title, text: sc.text, choices: sc.choices.map((c) => ({ label: c.label, sub: c.sub, score: c.score })) };
    }
    return { mode: 'actions', actions: ACTIONS.filter((a) => available(s, a)).map((a) => ({ id: a.id, label: a.label, hint: a.hint })) };
  }
  function act(s, id) {
    if (!idle(s)) return;
    const a = ACTIONS.find((x) => x.id === id);
    if (!a || !available(s, a)) return;
    const before = snap(s);
    const mode = s.phase;
    const n = mode === 'work' ? monthsPerTurn(s) : 0;
    const when = stamp(s);
    if (id !== 'slack' && s.job) s.job.streak = 0;
    const text = a.run(s);
    if (mode === 'search') endSearchTurn(s); else endWorkTurn(s, n);
    s.result = { title: a.label, text, when, deltas: diff(before, s) };
    flush(s);
  }
  function choose(s, i) {
    if (s.result || !s.queue.length || s.phase === 'over') return;
    const sc = build(s, s.queue[0]);
    const c = sc.choices[i];
    if (!c) return;
    s.queue.shift();
    const before = snap(s);
    const r = c.go(s);
    if (s.phase === 'over') return;
    if (typeof r === 'string') s.result = { title: sc.title, text: r, deltas: diff(before, s) };
    flush(s);
  }
  function next(s) { if (!s.result) return; s.result = null; flush(s); }
  function accept(s, id) {
    if (!idle(s)) return;
    const o = s.offers.find((x) => x.uid === id);
    if (!o) return;
    const T = TRACKS[o.track];
    const old = s.job;
    if (old && !TRACKS[old.track].trap) s.prev = { track: old.track, level: old.level, pay: old.pay };
    s.job = { track: o.track, company: o.company, level: o.level, pay: o.pay, prob: 3, months: 0, warn: 0, streak: 0, c: 0, watch: T.watch, owed: 0 };
    s.phase = 'work';
    s.week = 0;
    s.offers = [];
    s.invites = [];
    s.later = s.later.filter((x) => x.id !== 'callback');
    s.stats.perf = 50;
    s.stats.boss = 50;
    s.jobsHeld += 1;
    const pw = T.comm ? '底薪' : '月薪';
    log(s, `${old ? '跳槽到' : '入职'}${o.company}，${T.titles[o.level]}，${pw} ${money(o.pay)}`);
    let text = `${old ? `你给${old.company}递了辞呈。` : ''}你入职了${o.company}，岗位是${T.titles[o.level]}，${pw} ${money(o.pay)}。\n\n试用期三个月，看表现决定转不转正。试用期里摸鱼被抓，会直接被辞退。`;
    if (T.trap) text += '\n\n合同的事，负责人说“过阵子再说”。';
    s.queue.push({ id: 'info', p: { title: old ? '跳槽' : '入职', text } });
    if (T.dorm && s.house !== 'dorm') s.queue.push({ id: 'dorm' });
  }
  function decline(s, id) { if (idle(s)) s.invites = s.invites.filter((x) => x.uid !== id); }
  function move(s) { if (idle(s) && s.house) s.queue.push({ id: 'house', p: {} }); }
  function quit(s) { if (idle(s) && s.job) s.queue.push({ id: 'quit' }); }

  return {
    newGame, view, act, choose, next, accept, decline, move, quit, idle,
    stamp, money, last12, monthsPerTurn, calMonth, yearOf,
    TRACKS, HOUSES, ENDINGS, ENDING_ORDER, FOOD_WEEK,
  };
})();
globalThis.Core = Core;
/*CORE-END*/
</script>
<script>

// 插图：用 canvas 画的南屿。亮灯的窗户越多，说明你这一年挣得越多；随机种子固定，灯只会越亮越多。
const Art = (() => {
  function rng(seed) {
    let t = seed >>> 0;
    return () => {
      t = (t + 0x6d2b79f5) >>> 0;
      let x = Math.imul(t ^ (t >>> 15), t | 1);
      x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  const SKY = {
    dusk: ['#1f2e55', '#5b4a7d', '#e0937a'],
    night: ['#060b18', '#101b36', '#22345a'],
  };
  const WIN = '#ffd27a', WIN2 = '#fff1c9', LINE = '#36b0be', YOU = '#ffcf5a';

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.arc(x + w - r, y + r, r, -Math.PI / 2, Math.PI / 2);
    g.lineTo(x + r, y + h);
    g.arc(x + r, y + r, r, Math.PI / 2, Math.PI * 1.5);
    g.closePath();
    g.fill();
  }

  function sky(g, w, h, hour, R) {
    const c = SKY[hour];
    const gr = g.createLinearGradient(0, 0, 0, h * 0.8);
    gr.addColorStop(0, c[0]);
    gr.addColorStop(0.6, c[1]);
    gr.addColorStop(1, c[2]);
    g.fillStyle = gr;
    g.fillRect(0, 0, w, h);
    const n = Math.round(w / (hour === 'night' ? 9 : 28));
    for (let i = 0; i < n; i++) {
      const x = R() * w, y = R() * h * 0.5, a = 0.3 + R() * 0.7, r = R() < 0.9 ? 0.7 : 1.3;
      g.globalAlpha = a;
      g.fillStyle = '#ffffff';
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.fill();
    }
    g.globalAlpha = 1;
    // 月亮
    const mx = w * 0.82, my = h * 0.2, mr = Math.max(7, Math.min(18, h * 0.07));
    const glow = g.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4);
    glow.addColorStop(0, 'rgba(255,240,210,0.35)');
    glow.addColorStop(1, 'rgba(255,240,210,0)');
    g.fillStyle = glow;
    g.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
    g.fillStyle = '#fbf1d6';
    g.beginPath();
    g.arc(mx, my, mr, 0, Math.PI * 2);
    g.fill();
  }

  // 一排楼。每个窗户都固定掷两次骰子，亮灯比例变了，已亮的窗户不会熄
  function buildings(g, R, w, base, o) {
    const list = [];
    let x = -R() * 30;
    while (x < w + 10) {
      const bw = o.w[0] + R() * (o.w[1] - o.w[0]);
      const bh = o.h[0] + R() * (o.h[1] - o.h[0]);
      list.push({ x, y: base - bh, w: bw, h: bh, roof: R(), wins: [] });
      x += bw + R() * o.gap;
    }
    const s = o.win, sh = Math.round(s * 1.4);
    for (const b of list) {
      g.fillStyle = o.color;
      g.fillRect(Math.round(b.x), Math.round(b.y), Math.ceil(b.w), Math.ceil(b.h) + 1);
      if (b.roof < 0.2) g.fillRect(b.x + b.w * 0.3, b.y - 7, 2, 7);
      else if (b.roof < 0.32) g.fillRect(b.x + b.w * 0.2, b.y - 5, b.w * 0.45, 5);
      for (let wy = b.y + o.wgap + 2; wy + sh < base - 3; wy += sh + o.wgap) {
        for (let wx = b.x + o.wgap + 1; wx + s < b.x + b.w - 1; wx += s + o.wgap) {
          const r = R(), r2 = R();
          b.wins.push([Math.round(wx), Math.round(wy)]);
          if (r < o.lit) g.fillStyle = r2 < 0.8 ? WIN : WIN2;
          else if (o.dim) g.fillStyle = o.dim;
          else continue;
          g.fillRect(Math.round(wx), Math.round(wy), s, sh);
        }
      }
    }
    return list;
  }

  function ground(g, w, h, R, lit) {
    g.fillStyle = '#070c19';
    g.fillRect(0, h * 0.83, w, h * 0.17);
    const top = h * 0.875;
    const gr = g.createLinearGradient(0, top, 0, h);
    gr.addColorStop(0, '#0d1a33');
    gr.addColorStop(1, '#060b16');
    g.fillStyle = gr;
    g.fillRect(0, top, w, h - top);
    // 江面上的倒影
    const n = Math.round((w / 6) * (0.2 + lit));
    for (let i = 0; i < n; i++) {
      const x = R() * w, y = top + 3 + R() * Math.max(1, h - top - 5), len = 3 + R() * 10, a = 0.25 + R() * 0.5, c = R();
      g.globalAlpha = a;
      g.fillStyle = c < 0.8 ? WIN : '#9fe3ea';
      g.fillRect(x, y, len, 1);
    }
    g.globalAlpha = 1;
  }

  function rail(g, w, h, pos, beam) {
    const y = h * 0.845, bottom = h * 0.875;
    g.fillStyle = '#0b3a42';
    for (let x = 12; x < w; x += 46) g.fillRect(x, y + 3, 3, bottom - y - 3);
    g.fillStyle = LINE;
    g.fillRect(0, y, w, 3);
    const tw = Math.min(w * 0.32, 170), th = Math.max(8, Math.min(14, h * 0.055));
    const tx = w * pos, ty = y - th - 1;
    if (beam) {
      const bg = g.createLinearGradient(tx + tw, 0, tx + tw + 80, 0);
      bg.addColorStop(0, 'rgba(255,240,200,0.5)');
      bg.addColorStop(1, 'rgba(255,240,200,0)');
      g.fillStyle = bg;
      g.beginPath();
      g.moveTo(tx + tw, ty + th * 0.4);
      g.lineTo(tx + tw + 80, ty - 8);
      g.lineTo(tx + tw + 80, ty + th + 8);
      g.closePath();
      g.fill();
    }
    g.fillStyle = '#e9f0f1';
    roundRect(g, tx, ty, tw, th, th / 2);
    g.fillStyle = '#0a7482';
    g.fillRect(tx + 4, ty + th * 0.64, tw - 8, Math.max(1.5, th * 0.14));
    g.fillStyle = '#ffd98a';
    for (let x = tx + 8; x < tx + tw - 10; x += 9) g.fillRect(x, ty + th * 0.2, 5, th * 0.3);
  }

  function you(g, near) {
    const b = near[Math.floor(near.length * 0.62)];
    if (!b || !b.wins.length) return;
    const [x, y] = b.wins[Math.max(0, b.wins.length - 2)];
    g.save();
    g.shadowColor = '#ffb347';
    g.shadowBlur = 14;
    g.fillStyle = YOU;
    g.fillRect(x - 0.5, y - 0.5, 4.5, 6);
    g.restore();
    const lx = b.x + b.w / 2, ly = b.y - 13;
    g.strokeStyle = YOU;
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(lx, ly + 8);
    g.lineTo(lx, b.y);
    g.stroke();
    g.fillStyle = YOU;
    g.beginPath();
    g.arc(lx, ly, 8.5, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = '#3a2600';
    g.font = '700 10px "Noto Sans SC", "PingFang SC", sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('你', lx, ly + 0.5);
  }

  function city(g, w, h, R, o) {
    const night = o.hour === 'night', lit = o.lit ?? 0.3;
    buildings(g, R, w, h * 0.74, { h: [h * 0.18, h * 0.44], w: [16, 38], gap: 4, color: night ? '#18264a' : '#3d3c66', lit: lit * 0.45, win: 2, wgap: 3 });
    buildings(g, R, w, h * 0.79, { h: [h * 0.14, h * 0.5], w: [22, 46], gap: 6, color: night ? '#101a33' : '#2b2a4c', lit: lit * 0.75, win: 3, wgap: 3, dim: 'rgba(255,255,255,0.05)' });
    const near = buildings(g, R, w, h * 0.83, { h: [h * 0.12, h * 0.34], w: [26, 58], gap: 8, color: night ? '#0a1226' : '#1c1a34', lit, win: 3.5, wgap: 3.5, dim: 'rgba(255,255,255,0.06)' });
    ground(g, w, h, R, lit);
    rail(g, w, h, o.mode === 'arrive' ? 0.04 : 0.56, o.mode === 'arrive');
    if (o.you) you(g, near);
  }

  function hills(g, w, base, amp, color, R) {
    const p = R() * 6, f = 0.008 + R() * 0.006;
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(0, 4000);
    for (let x = 0; x <= w + 6; x += 6) g.lineTo(x, base - Math.sin(x * f + p) * amp - Math.sin(x * f * 2.3 + p) * amp * 0.4);
    g.lineTo(w + 6, 4000);
    g.closePath();
    g.fill();
  }

  // 回老家：傍晚的小县城，火车往外开
  function home(g, w, h, R) {
    hills(g, w, h * 0.62, h * 0.1, '#3a3a64', R);
    hills(g, w, h * 0.72, h * 0.08, '#262747', R);
    const base = h * 0.83;
    let x = w * 0.06;
    while (x < w * 0.64) {
      const bw = 16 + R() * 18, bh = h * (0.06 + R() * 0.08), lit = R();
      g.fillStyle = '#16152b';
      g.fillRect(x, base - bh, bw, bh + 1);
      g.beginPath();
      g.moveTo(x - 2, base - bh);
      g.lineTo(x + bw / 2, base - bh - 7);
      g.lineTo(x + bw + 2, base - bh);
      g.closePath();
      g.fill();
      if (lit < 0.5) { g.fillStyle = WIN; g.fillRect(x + bw * 0.35, base - bh * 0.65, 4, 5); }
      x += bw + 4 + R() * 14;
    }
    ground(g, w, h, R, 0.08);
    rail(g, w, h, 0.66, false);
  }

  // o: { mode: 'arrive' | 'city' | 'home', hour: 'dusk' | 'night', lit: 0..1, you: bool, seed }
  function paint(cv, o) {
    if (!cv) return;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const R = rng(o.seed || 7);
    sky(g, w, h, o.hour || 'night', R);
    if (o.mode === 'home') home(g, w, h, R);
    else city(g, w, h, R, o);
  }
  return { paint };
})();

(() => {
  const C = globalThis.Core;
  const KEY = { auto: 'sqjc.auto.v1', slot: 'sqjc.slot.v1', album: 'sqjc.album.v1' };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* 无痕模式等情况下存不了，游戏照常玩 */ } },
    del(k) { try { localStorage.removeItem(k); } catch { /* 同上 */ } },
  };
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const paras = (t) => esc(t).split('\n\n').map((p) => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
  let S = null;
  const START_ART = { mode: 'arrive', hour: 'dusk', lit: 0.3, seed: 11 };
  // 交通卡上的天际线：上班后是夜里，近一年挣得越多，亮灯的窗户越多
  const cityArt = (s) => ({ mode: 'city', hour: s.phase === 'work' ? 'night' : 'dusk', lit: 0.12 + 0.6 * Math.min(1, Math.sqrt(C.last12(s) / 1e6)), you: Boolean(s.house), seed: 20261 });
  function endArt(id) {
    const lit = { million: 0.9, success: 0.7, backbone: 0.5, light: 0.32 }[id];
    return lit ? { mode: 'city', hour: 'night', lit, you: true, seed: 20261 } : { mode: 'home', hour: 'dusk', seed: 31 };
  }
  function paintAll() {
    if (!S) { Art.paint($('artStart'), START_ART); return; }
    Art.paint($('artCity'), cityArt(S));
    if (S.ending) Art.paint($('artEnd'), endArt(S.ending.id));
  }

  function readJSON(raw) { try { const x = JSON.parse(raw); return x && x.v === 1 ? x : null; } catch { return null; } }
  function album() { try { return JSON.parse(store.get(KEY.album) || '[]'); } catch { return []; } }
  function addAlbum(id) { const a = album(); if (!a.includes(id)) { a.push(id); store.set(KEY.album, JSON.stringify(a)); } }
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    clearTimeout(toast.h);
    toast.h = setTimeout(() => { t.textContent = ''; }, 2400);
  }

  function albumHTML() {
    const got = album();
    return `<h3>结局图鉴 · 已解锁 ${got.length}/${C.ENDING_ORDER.length}</h3><div class="slots">${C.ENDING_ORDER.map((id) =>
      `<div class="slot${got.includes(id) ? ' got' : ''}">${got.includes(id) ? esc(C.ENDINGS[id].title) : '？？？'}</div>`).join('')}</div>`;
  }

  function meter(name, v) {
    return `<div class="meter${v < 25 ? ' low' : ''}"><span>${name}</span><span class="bar"><i style="width:${v}%"></i></span><span class="v">${v}</span></div>`;
  }

  function renderPass() {
    const s = S, j = s.job, st = s.stats;
    const T = j && C.TRACKS[j.track];
    const role = j ? `${T.titles[j.level]} · ${j.company}${j.prob > 0 ? ' · 试用期' : ''}` : '待业中';
    const house = s.house ? C.HOUSES[s.house].name : '还没找到住处';
    const pct = Math.min(100, (s.month / 60) * 100);
    const stops = ['出发', '1年', '2年', '3年', '4年', '同学会'];
    const meters = [meter('精力', st.energy), meter('心态', st.mood)];
    if (j) meters.push(meter('表现', st.perf), meter('领导', st.boss));
    const chips = [['专业', st.skill], ['表达', st.talk], ['人脉', st.network]];
    if (j) chips.push([T.comm ? '底薪' : '月薪', C.money(j.pay)]);
    if (s.month > 0) chips.push(['近一年收入', C.money(C.last12(s))]);
    if (s.flags.side) chips.push(['粉丝', s.side.toLocaleString('en-US')]);
    if (s.flags.kaogong) chips.push(['备考', Math.min(100, s.exam)]);
    $('pass').innerHTML = `
      <div class="pass-band"><span class="brand">三千块进城</span><span class="mono date">${esc(C.stamp(s))}</span></div>
      <div class="art-strip"><canvas class="art" id="artCity" role="img" aria-label="南屿的夜景。亮灯的窗户越多，说明你近一年挣得越多"></canvas></div>
      <div class="pass-body">
        <div class="bal"><span class="lbl">存款</span><span class="mono num${st.cash < 0 ? ' neg' : ''}">${C.money(st.cash)}</span></div>
        <div class="who"><b>${esc(s.name)}</b><span>${esc(role)}</span><span>住 ${esc(house)}</span></div>
        <div class="metro" aria-label="五年进度：${Math.round(pct)}%">
          <div class="rail"><i style="width:${pct}%"></i><b style="left:${pct}%"></b></div>
          <ol class="stops">${stops.map((x, i) => `<li class="${s.month >= i * 12 ? 'on' : ''}">${x}</li>`).join('')}</ol>
        </div>
        <div class="meters">${meters.join('')}</div>
        <div class="chips">${chips.map(([k, v]) => `<span class="chip">${k}<b>${esc(v)}</b></span>`).join('')}</div>
      </div>`;
  }

  function costLine(s) {
    const H = C.HOUSES[s.house];
    const rent = H.rent ? H.rent + s.rentAdj : 0;
    if (s.phase === 'search') return `每周饭钱 ${C.money(C.FOOD_WEEK)}${H.week ? `，床位 ${C.money(H.week)}` : ''}${rent ? `；每 4 周交一次房租 ${C.money(rent)}` : ''}。投出去的简历，下周去面试。`;
    const n = C.monthsPerTurn(s);
    const living = 1200 + Math.round(s.job.pay * 0.1) + (H.week ? H.week * 4 : 0);
    return `这一回合是 ${n === 3 ? '一个季度' : '一个月'}。每月房租 ${C.money(rent)}，生活费约 ${C.money(living)}。${s.job.prob > 0 ? `试用期还剩 ${s.job.prob} 个月。` : ''}`;
  }

  function renderStage() {
    const v = C.view(S), el = $('stage');
    if (v.mode === 'ending') {
      const e = S.ending;
      addAlbum(e.id);
      el.innerHTML = `<div class="card ending">
        <div class="art-end"><canvas class="art" id="artEnd" role="img" aria-label="结局插图"></canvas></div>
        <p class="eyebrow">${esc(e.tag)}</p>
        <h2 class="end-title">${esc(e.title)}</h2>
        <div class="txt">${paras(e.text)}</div>
        <dl class="sum">
          <dt>最近一年收入</dt><dd>${C.money(e.inc)}</dd>
          <dt>存款</dt><dd>${C.money(e.cash)}</dd>
          <dt>最后的身份</dt><dd>${esc(e.role)}</dd>
          <dt>在南屿待了</dt><dd>${e.months} 个月</dd>
        </dl>
        <div class="album">${albumHTML()}</div>
        <div class="free"><button class="primary" type="button" data-again>再来一次</button></div>
      </div>`;
      return;
    }
    if (v.mode === 'result') {
      const ds = (v.deltas || []).map((d) => {
        const val = d.k === 'cash' ? C.money(Math.abs(d.d)) : Math.abs(d.d);
        return `<span class="delta ${d.d > 0 ? 'up' : 'down'}">${d.name} ${d.d > 0 ? '+' : '−'}${val}</span>`;
      }).join('');
      el.innerHTML = `<div class="card">
        ${v.when ? `<p class="kicker mono">${esc(v.when)}</p>` : ''}
        <h2>${esc(v.title)}</h2>
        <div class="txt">${paras(v.text)}</div>
        ${ds ? `<div class="deltas">${ds}</div>` : '<div class="deltas"></div>'}
        <button class="primary" type="button" data-next>继续</button>
      </div>`;
      return;
    }
    if (v.mode === 'scene') {
      el.innerHTML = `<div class="card">
        <h2>${esc(v.title)}</h2>
        <div class="txt">${paras(v.text)}</div>
        <div class="choices">${v.choices.map((c, i) => `<button class="choice" type="button" data-choose="${i}"><span>${esc(c.label)}</span>${c.sub ? `<small>${esc(c.sub)}</small>` : ''}</button>`).join('')}</div>
      </div>`;
      return;
    }
    const head = S.phase === 'search' ? '这周做什么？' : C.monthsPerTurn(S) === 3 ? '这个季度主要做什么？' : '这个月主要做什么？';
    el.innerHTML = `<div class="card">
      <h2>${head}</h2>
      <p class="sub">${esc(costLine(S))}</p>
      <div class="grid">${v.actions.map((a) => `<button class="act" type="button" data-act="${a.id}"><b>${esc(a.label)}</b><small>${esc(a.hint)}</small></button>`).join('')}</div>
      <div class="free">
        <button class="ghost" type="button" data-move>换住处</button>
        ${S.job ? '<button class="ghost" type="button" data-quit>辞职</button>' : ''}
      </div>
    </div>`;
  }

  function renderTickets() {
    const s = S, el = $('tickets');
    if (s.phase === 'over' || (!s.offers.length && !s.invites.length)) { el.innerHTML = ''; return; }
    const idle = C.idle(s);
    const offers = s.offers.map((o) => {
      const T = C.TRACKS[o.track];
      const left = o.exp - s.turn;
      return `<div class="ticket offer"><div>
        <span class="tag">OFFER · ${left <= 0 ? '这回合不接就过期' : `还能等 ${left + 1} 回合`}</span>
        <b>${esc(T.titles[o.level])}</b>
        <small>${esc(o.company)} · ${T.comm ? '底薪' : '月薪'} ${C.money(o.pay)} · ${esc(T.blurb)}</small>
      </div><button class="take" type="button" data-accept="${o.uid}" ${idle ? '' : 'disabled'}>接受</button></div>`;
    }).join('');
    const invites = s.invites.map((v) => {
      const T = C.TRACKS[v.track];
      return `<div class="ticket"><div>
        <span class="tag">${v.at <= s.turn ? '本周面试' : '下周面试'}</span>
        <b>${esc(T.titles[v.level])}</b>
        <small>${esc(v.company)} · ${C.money(v.lo)}–${C.money(v.hi)} · ${esc(T.blurb)}</small>
      </div><button class="ghost" type="button" data-decline="${v.uid}" ${idle ? '' : 'disabled'}>不去了</button></div>`;
    }).join('');
    el.innerHTML = (offers ? `<h3 class="sec-title">手上的 offer</h3>${offers}` : '')
      + (invites ? `<h3 class="sec-title">面试邀约 · 每周最多去两个</h3>${invites}` : '');
  }

  function renderRoute() {
    $('route').innerHTML = `<h3 class="sec-title">行程记录</h3><ol class="stations">${S.log.slice(0, 40).map((e) =>
      `<li><span class="mono t">${esc(e.t)}</span><span>${esc(e.x)}</span></li>`).join('')}</ol>`;
  }

  function render() {
    const start = $('start'), game = $('game');
    if (!S) {
      start.hidden = false;
      game.hidden = true;
      $('album').innerHTML = albumHTML();
      paintAll();
      return;
    }
    start.hidden = true;
    game.hidden = false;
    renderPass();
    renderStage();
    renderTickets();
    renderRoute();
    paintAll();
    store.set(KEY.auto, JSON.stringify(S));
  }

  function keepStageInView() {
    const r = $('stage').getBoundingClientRect();
    if (r.top < 0 || r.top > window.innerHeight * 0.75) $('stage').scrollIntoView({ block: 'start', behavior: reduced ? 'auto' : 'smooth' });
  }

  let armed = 0;
  $('app').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if (b.id === 'go') {
      S = C.newGame($('nm').value);
    } else if (!S && !('load' in d)) {
      if ('save' in d || 'restart' in d) toast('还没开始呢');
      return;
    } else if ('choose' in d) C.choose(S, Number(d.choose));
    else if ('act' in d) C.act(S, d.act);
    else if ('next' in d) C.next(S);
    else if ('accept' in d) C.accept(S, Number(d.accept));
    else if ('decline' in d) C.decline(S, Number(d.decline));
    else if ('move' in d) C.move(S);
    else if ('quit' in d) C.quit(S);
    else if ('again' in d) { S = null; store.del(KEY.auto); }
    else if ('save' in d) {
      if (S.phase === 'over') { toast('这一局已经结束了'); return; }
      store.set(KEY.slot, JSON.stringify(S));
      toast(store.get(KEY.slot) ? `已存档：${C.stamp(S)}` : '这个浏览器存不了档');
      return;
    } else if ('load' in d) {
      const x = readJSON(store.get(KEY.slot));
      if (!x) { toast('还没有存档'); return; }
      S = x;
      toast(`已读档：${C.stamp(S)}`);
    } else if ('restart' in d) {
      if (!armed) {
        armed = 1;
        b.textContent = '再点一次，确认重来';
        setTimeout(() => { armed = 0; b.textContent = '重新开始'; }, 3000);
        return;
      }
      armed = 0;
      b.textContent = '重新开始';
      S = null;
      store.del(KEY.auto);
    } else return;
    render();
    if (S) keepStageInView();
  });
  let resizeTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(paintAll, 150); });
  // 字体加载完再画一遍，插图里的“你”字才用得上正确的字体
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(paintAll);
  $('nm').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });

  function start(data) {
    S = (data && data.S) || readJSON(store.get(KEY.auto));
    render();
  }
  window.claude?.hot?.snapshot?.(() => ({ S }));
  if (window.claude?.hot?.ready) window.claude.hot.ready(start);
  else start(window.claude?.hot?.data ?? {});
})();
</script>
